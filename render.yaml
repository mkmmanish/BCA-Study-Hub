services:
  - type: web
    name: bca-study-hub
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: study-hub-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Hub Administrator
      - key: DATABASE_PATH
        value: /var/data/study-hub.sqlite
      - key: UPLOAD_DIR
        value: /var/data/uploads
